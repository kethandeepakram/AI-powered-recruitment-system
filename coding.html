<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Assessment</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --dark-bg: #121212;
      --darker-bg: #0a0a0a;
      --panel-bg: #1e1e1e;
      --border-color: #333;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --header-height: 60px;
      --footer-height: 40px;
    }
    * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, sans-serif;}
    body {background-color:var(--dark-bg); color:var(--text-color); display:flex; flex-direction:column; height:100vh; overflow:hidden;}
    header {height:var(--header-height); background-color:var(--darker-bg); border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:10;}
    .logo-title {display:flex; align-items:center; gap:12px;}
    .logo-title h1 {font-size:1.5rem; font-weight:600;}
    .timer-container {display:flex; align-items:center; gap:10px; background-color:rgba(0,0,0,0.3); padding:8px 15px; border-radius:6px;}
    .timer-icon {color:var(--primary-color);}
    .timer {font-weight:600; transition:color 0.3s;}
    .timer.urgent {color:var(--danger-color);}
    .timer.warning {color:var(--warning-color);}
    .main-container {display:flex; flex:1; overflow:hidden;}
    .problem-panel {width:40%; background-color:var(--panel-bg); border-right:1px solid var(--border-color); display:flex; flex-direction:column; overflow:hidden;}
    .tab-navigation {display:flex; border-bottom:1px solid var(--border-color); background-color:rgba(0,0,0,0.2);}
    .tab-btn {padding:12px 20px; background:none; border:none; color:var(--text-color); font-weight:500; cursor:pointer; position:relative; transition:background-color 0.2s;}
    .tab-btn:hover {background-color:rgba(255,255,255,0.05);}
    .tab-btn.active {color:var(--primary-color);}
    .tab-btn.active::after {content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; background-color:var(--primary-color);}
    .tab-content {flex:1; overflow-y:auto; padding:20px;}
    .tab-pane {display:none;}
    .tab-pane.active {display:block;}
    .problem-title {font-size:1.5rem; margin-bottom:20px; color:var(--primary-color); border-bottom:1px solid var(--border-color); padding-bottom:10px;}
    .problem-description {line-height:1.6; margin-bottom:20px;}
    .problem-section {margin-bottom:20px;}
    .section-title {font-size:1.1rem; font-weight:600; margin-bottom:10px; color:var(--primary-color);}
    .test-case {background-color:rgba(0,0,0,0.3); border-radius:6px; padding:12px 15px; margin-bottom:15px;}
    .test-case-title {font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between;}
    .test-case-content {font-family:monospace; white-space:pre-wrap; margin-bottom:10px; color:var(--text-muted);}
    .editor-panel {flex:1; display:flex; flex-direction:column; overflow:hidden;}
    .editor-header {display:flex; justify-content:space-between; padding:8px 15px; background-color:rgba(0,0,0,0.2); border-bottom:1px solid var(--border-color);}
    .language-selector {display:flex; align-items:center; gap:10px;}
    select {background-color:var(--panel-bg); color:var(--text-color); border:1px solid var(--border-color); padding:5px 10px; border-radius:4px;}
    .editor-container {flex:1; position:relative; overflow:hidden;}
    .status-message {padding:8px 15px; background-color:var(--darker-bg); color:var(--text-muted); text-align:center; border-top:1px solid var(--border-color);}
    .status-message.error {background-color:rgba(239,68,68,0.2); color:var(--danger-color);}
    .status-message.success {background-color:rgba(16,185,129,0.2); color:var(--success-color);}
    .status-message.warning {background-color:rgba(245,158,11,0.2); color:var(--warning-color);}
    .navigation-actions {display:flex; justify-content:space-between; padding:15px; background-color:var(--panel-bg); border-top:1px solid var(--border-color);}
    .action-group {display:flex; gap:10px;}
    .btn {padding:8px 16px; border-radius:4px; font-weight:500; cursor:pointer; transition:background-color 0.2s, opacity 0.2s; border:none;}
    .btn:disabled {opacity:0.5; cursor:not-allowed;}
    .btn-primary {background-color:var(--primary-color); color:white;}
    .btn-primary:hover:not(:disabled) {background-color:var(--primary-hover);}
    .btn-outline {background-color:transparent; color:var(--text-color); border:1px solid var(--border-color);}
    .btn-outline:hover:not(:disabled) {background-color:rgba(255,255,255,0.05);}
    footer {height:var(--footer-height); background-color:var(--darker-bg); border-top:1px solid var(--border-color); display:flex; justify-content:center; align-items:center; color:var(--text-muted); font-size:0.85rem;}
    @media (max-width:1200px) {
      .main-container {flex-direction:column;}
      .problem-panel {width:100%; height:40%; border-right:none; border-bottom:1px solid var(--border-color);}
    }
    #ace-editor {width:100%; height:100%;}
    ::-webkit-scrollbar {width:10px; height:10px;}
    ::-webkit-scrollbar-track {background:var(--panel-bg);}
    ::-webkit-scrollbar-thumb {background:var(--border-color); border-radius:5px;}
    ::-webkit-scrollbar-thumb:hover {background:#555;}
    #fallback-editor {width:100%; height:100%; padding:10px; background:#1e1e1e; color:#e2e8f0; border:none; font-family:monospace;}
  </style>
</head>
<body>
  <header>
    <div class="logo-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#2563eb;"><path d="M9 11v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2zm0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6m0 0v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2z"/></svg>
      <h1>Coding Assessment</h1>
    </div>
    <div class="timer-container">
      <svg xmlns="http://www.w3.org/2000/svg" class="timer-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <div id="timer" class="timer">Time left: 10:00</div>
    </div>
  </header>
  
  <div class="main-container">
    <div class="problem-panel">
      <div class="tab-navigation">
        <button class="tab-btn active" data-tab="statement">Problem Statement</button>
        <button class="tab-btn" data-tab="examples">Examples</button>
        <button class="tab-btn" data-tab="hints">Hints</button>
      </div>
      <div class="tab-content">
        <div id="statement-tab" class="tab-pane active">
          <h2 id="problemTitle" class="problem-title">Loading problem...</h2>
          <div id="problemDescription" class="problem-description">
            Please wait while we load the problem statement...
          </div>
        </div>
        <div id="examples-tab" class="tab-pane">
          <div class="problem-section">
            <h3 class="section-title">Example Test Cases</h3>
            <div id="exampleCases">
              <!-- Example test cases will be inserted here -->
            </div>
          </div>
        </div>
        <div id="hints-tab" class="tab-pane">
          <div class="problem-section">
            <h3 class="section-title">Hints & Guidelines</h3>
            <div id="hintsContent">
              <p>No hints available for this problem. Try to solve it step by step!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="editor-panel">
      <div class="editor-header">
        <div class="language-selector">
          <label for="languageSelect">Language:</label>
          <select id="languageSelect">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="clike">C/C++</option>
          </select>
        </div>
        <div id="questionCounter">Question 1 of 3</div>
      </div>
      <div id="editorContainer" class="editor-container">
        <!-- Ace Editor will be initialized here -->
      </div>
      <div class="status-message" id="statusMessage">Initializing assessment...</div>
      <div class="navigation-actions">
        <div class="action-group">
          <button id="prevBtn" class="btn btn-outline" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Previous
          </button>
          <button id="nextBtn" class="btn btn-outline">
            Next
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <div class="action-group">
          <button id="submitBtn" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Submit Solution
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <footer>
    <p>HR Interview System &copy; 2025</p>
  </footer>
  
  <!-- Ace Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.0/ace.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.0/ext-language_tools.js"></script>
  
  <!-- Application JS -->
  <script src="coding.js"></script>
</body>
</html>
