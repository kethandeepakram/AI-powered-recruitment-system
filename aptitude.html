<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Interview System - Aptitude Test</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background-color:#121212;color:#f5f5f5;margin:0;padding:0}
    .container{display:grid;grid-template-columns:3fr 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;grid-column:1/span 2}
    h1{font-size:2rem;margin:0}
    .timer{font-size:1.1rem;font-weight:bold;padding:8px 15px;background-color:#333;border-radius:4px;color:#ff5252}
    .status{padding:15px;margin-bottom:20px;border-radius:4px;background-color:#333;grid-column:1/span 2;transition:all 0.3s ease}
    .question-number{font-size:0.9rem;color:#aaa;margin-bottom:8px}
    .question-text{font-size:1.3rem;margin-bottom:15px;line-height:1.5}
    .question-category{font-size:0.9rem;color:#aaa;margin-bottom:20px}
    .option{margin-bottom:12px}
    .option-label{display:flex;align-items:center;padding:15px;border-radius:6px;cursor:pointer;background-color:#333;color:white;width:100%;box-sizing:border-box}
    .option-label:hover{background-color:#444}
    .option-label.selected{background-color:#2563eb}
    .option-circle{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background-color:#555;margin-right:15px;font-weight:bold;color:white}
    .option-label.selected .option-circle{background-color:white;color:#2563eb}
    .option-text{flex:1;color:white;font-size:1.05rem}
    .option input[type="radio"]{display:none}
    .navigation{display:flex;justify-content:space-between;margin-top:30px}
    .nav-btn,.submit-btn{padding:12px 24px;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:1rem}
    .nav-btn{background-color:#444;color:white}
    .nav-btn:hover:not(:disabled){background-color:#555}
    .submit-btn{background-color:#2563eb;color:white}
    .submit-btn:hover:not(:disabled){background-color:#1d4ed8}
    footer{text-align:center;padding:20px 0;margin-top:40px;color:#888;font-size:0.9rem;grid-column:1/span 2}
    .proctor-panel{background-color:#1f1f1f;border-radius:8px;padding:15px;grid-column:2;grid-row:2/span 2}
    .camera-container{width:100%;margin-bottom:15px;border-radius:6px;overflow:hidden;border:2px solid #333;position:relative}
    #userVideo{width:100%;display:block}
    .test-container{grid-column:1;grid-row:2}
    
    /* Enhanced warning message styling */
    .warning-msg{
      color:#ffffff;
      font-weight:bold;
      text-align:center;
      margin-top:10px;
      display:none;
      background-color:#ff0000;
      padding:12px;
      border-radius:4px;
      box-shadow:0 0 15px rgba(255,0,0,0.7);
      animation:pulse-warning 1.5s infinite;
      border:2px solid #fff;
      font-size:1.1rem;
    }
    
    @keyframes pulse-warning {
      0% { opacity:1; transform:scale(1); box-shadow:0 0 15px rgba(255,0,0,0.7); }
      50% { opacity:0.8; transform:scale(1.05); box-shadow:0 0 25px rgba(255,0,0,0.9); }
      100% { opacity:1; transform:scale(1); box-shadow:0 0 15px rgba(255,0,0,0.7); }
    }
    
    .status.cheating{
      background-color:#e74c3c;
      color:white;
      font-weight:bold;
      animation:pulse-status 1.5s infinite;
      box-shadow:0 0 15px rgba(231,76,60,0.7);
    }
    
    @keyframes pulse-status {
      0% { background-color:#e74c3c; }
      50% { background-color:#c0392b; }
      100% { background-color:#e74c3c; }
    }
    
    .proctor-terminal{
      font-family:monospace;
      font-size:12px;
      color:#fff;
      background-color:#000;
      padding:10px;
      border-radius:4px;
      margin-top:10px;
      min-height:60px;
      border:1px solid #333;
      overflow:auto;
      max-height:120px;
    }
    
    /* Proctoring status indicators */
    .proctor-status{
      display:flex;
      justify-content:space-between;
      margin:10px 0;
    }
    
    .proctor-status-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      flex:1;
    }
    
    .status-indicator{
      width:12px;
      height:12px;
      border-radius:50%;
      margin-bottom:5px;
    }
    
    .status-indicator.active{
      background-color:#2ecc71;
      box-shadow:0 0 10px rgba(46,204,113,0.7);
      animation:pulse-indicator 2s infinite;
    }
    
    .status-indicator.warning{
      background-color:#f39c12;
      box-shadow:0 0 10px rgba(243,156,18,0.7);
      animation:pulse-indicator 1s infinite;
    }
    
    .status-indicator.error{
      background-color:#e74c3c;
      box-shadow:0 0 10px rgba(231,76,60,0.7);
      animation:pulse-indicator 0.5s infinite;
    }
    
    @keyframes pulse-indicator {
      0% { opacity:1; }
      50% { opacity:0.5; }
      100% { opacity:1; }
    }
    
    .status-label{
      font-size:10px;
      color:#aaa;
    }
    
    /* Movement level indicator */
    .movement-level-container{
      width:100%;
      height:5px;
      background-color:#333;
      border-radius:3px;
      margin-top:10px;
      overflow:hidden;
    }
    
    .movement-level-bar{
      height:100%;
      width:10%;
      background:linear-gradient(90deg, #2ecc71, #f39c12, #e74c3c);
      transition:width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Aptitude Assessment</h1>
      <div id="timer" class="timer">Time left: 0:00</div>
    </header>

    <div id="status" class="status">Initializing test...</div>
    
    <div class="test-container">
      <div id="questionArea" class="question-area"></div>
      <div id="optionsContainer" class="options-container"></div>
      <div class="navigation">
        <button id="prevBtn" class="nav-btn">Previous</button>
        <button id="nextBtn" class="nav-btn">Next</button>
        <button id="submitBtn" class="submit-btn">Submit Test</button>
      </div>
    </div>
    
    <div class="proctor-panel">
      <h3>PROCTORING</h3>
      <div class="camera-container">
        <video id="userVideo" autoplay muted></video>
      </div>
      <div class="proctor-status">
        <div class="proctor-status-item">
          <div id="cameraStatus" class="status-indicator active"></div>
          <div class="status-label">CAMERA</div>
        </div>
        <div class="proctor-status-item">
          <div id="faceStatus" class="status-indicator active"></div>
          <div class="status-label">FACE</div>
        </div>
        <div class="proctor-status-item">
          <div id="movementStatus" class="status-indicator active"></div>
          <div class="status-label">MOVEMENT</div>
        </div>
      </div>
      <div class="movement-level-container">
        <div id="movementLevelBar" class="movement-level-bar"></div>
      </div>
      <div id="proctorWarning" class="warning-msg">Keep your eyes on the screen!</div>
      <div id="proctorTerminal" class="proctor-terminal">System initializing...</div>
    </div>

    <footer>
      <p>HR Interview System &copy; 2025</p>
    </footer>
  </div>
  
  <script src="aptitude.js"></script>
</body>
</html>
